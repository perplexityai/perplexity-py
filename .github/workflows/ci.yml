name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: '1.26'

      - name: Install Lefthook
        run: |
          go install github.com/evilmartians/lefthook/v2@v2.1.9
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Lefthook file checks
        run: lefthook run pre-commit --all-files --force --fail-on-changes

      - name: Run Lefthook commit checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          commits="$RUNNER_TEMP/commits"
          message="$RUNNER_TEMP/commit-message"

          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git rev-list --reverse "$BASE_SHA..$HEAD_SHA" > "$commits"
          else
            echo "$HEAD_SHA" > "$commits"
          fi

          while IFS= read -r commit; do
            git show --no-patch --format=%B "$commit" > "$message"
            lefthook run commit-msg "$message" --force
          done < "$commits"

  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-test
          repository-cache: true

      - name: Run tests
        run: bazel test //...
